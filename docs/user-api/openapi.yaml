  /jobs:
    get:
      summary: List jobs
      description: Retrieve a paginated list of jobs owned by the authenticated user
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [preparing, pending, running, paused, processing, completed, failed, cancelled]
          description: Filter by job status
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create job
      description: |
        Create a new cracking job using a preset configuration or workflow.

        You must specify either `preset_job_id` OR `workflow_id`, but not both.

        **Note:** The maximum priority value is determined by the `max_job_priority`
        system setting (default: 1000).
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - hashlist_id
              properties:
                name:
                  type: string
                  description: Job name
                hashlist_id:
                  type: integer
                  description: ID of the hashlist to crack
                preset_job_id:
                  type: string
                  format: uuid
                  description: Preset job ID (mutually exclusive with workflow_id)
                workflow_id:
                  type: string
                  format: uuid
                  description: Workflow ID (mutually exclusive with preset_job_id)
                priority:
                  type: integer
                  minimum: 1
                  default: 5
                  description: Job priority (1=lowest). Max determined by system setting (default 1000)
                max_agents:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Maximum agents to assign (0=unlimited)
                increment_mode:
                  type: string
                  enum: [off, enabled, enabled_with_brain]
                  default: "off"
                  description: Enable increment mode for variable-length password attacks
            example:
              name: "Potfile Run for Client ABC"
              hashlist_id: 123
              preset_job_id: "fe03b156-df7a-41a8-a591-abce3c0f0217"
              priority: 8
              max_agents: 5
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Hashlist, preset, or workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
