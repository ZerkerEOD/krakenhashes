      summary: List hashlists selectable for a report
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Hashlist summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400': { description: client_id is required or invalid }

