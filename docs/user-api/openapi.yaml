  /analytics/reports:
    post:
      tags: [Analytics]
      summary: Queue a new analytics report
      description: Creates a password analytics report for a client and queues it for background generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                  format: uuid
                hashlist_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Hashlists to analyze. If omitted, falls back to the client's hashlists in the date range.
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                custom_patterns:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Report queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '400': { description: Validation error }
        '401': { description: Authentication required }
        '404': { description: Client not found (or not accessible) }
    get:
      tags: [Analytics]
      summary: List analytics reports for a client
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reports for the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsReport'
                  total:
                    type: integer
        '400': { description: client_id is required or invalid }
        '404': { description: Client not found (or not accessible) }

  /analytics/reports/bloodhound:
    post:
      tags: [Analytics]
      summary: Queue a report enriched with a BloodHound dump
      description: |
        Creates an analytics report enriched with an uploaded BloodHound / SharpHound Active Directory
        collection dump. The dump (a SharpHound `.zip` or one or more BloodHound `.json` files) is parsed
        **in memory only** — the raw dump is never written to disk, and the compact derived AD-privilege
        context is deleted after the report finishes generating. Re-analysis requires re-uploading the dump.

        The enrichment cross-references CRACKED accounts against their AD standing: privileged/tier-0
        membership, Kerberoastable/AS-REP roastable, admincount, DCSync rights, local-admin blast radius,
        and graph attack paths to Domain Admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [client_id, hashlist_ids, file]
              properties:
                client_id:
                  type: string
                  format: uuid
                hashlist_ids:
                  type: string
                  description: JSON array (e.g. "[1,2,3]") or CSV (e.g. "1,2,3") of hashlist IDs.
                start_date:
                  type: string
                  description: RFC3339; defaults to now.
                end_date:
                  type: string
                  description: RFC3339; defaults to now.
                custom_patterns:
                  type: string
                  description: JSON array or CSV of custom patterns.
                file:
                  type: string
                  format: binary
                  description: SharpHound .zip or a BloodHound .json file (repeatable).
      responses:
        '201':
          description: Report queued with derived AD context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '400': { description: Validation error / invalid or oversized upload }
        '401': { description: Authentication required }
        '404': { description: Client not found (or not accessible) }
        '413': { description: Upload exceeds configured size limits }

  /analytics/reports/{id}:
    get:
      tags: [Analytics]
      summary: Get an analytics report (including its metrics)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The report, including analytics_data when completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '404': { description: Report not found }
    delete:
      tags: [Analytics]
      summary: Delete an analytics report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204': { description: Deleted }
        '404': { description: Report not found }

  /analytics/reports/{id}/retry:
    post:
      tags: [Analytics]
      summary: Retry a failed report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Re-queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '400': { description: Only failed reports can be retried }
        '404': { description: Report not found }

  /analytics/reports/{id}/export:
    get:
      tags: [Analytics]
      summary: Export a completed report as a PDF
      description: |
        Renders a completed report as a PDF. `type=internal` contains full detail (plaintext passwords,
        usernames, hash values, per-account AD detail); `type=external` is an aggregate-only summary with
        identifying detail redacted server-side.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [internal, external]
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [pdf]
      responses:
        '200':
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { description: Invalid type, or report not completed }
        '404': { description: Report not found }

  /analytics/hashlists:
    get:
