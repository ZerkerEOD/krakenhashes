<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171a21" />
    <meta name="description" content="KrakenHashes - Distributed password cracking system for security professionals" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>KrakenHashes</title>
    <script>
      // Pre-paint: resolve the stored theme preference before the bundle loads so
      // the first frame already has the right background (keys mirror styles/tokens.ts).
      (function () {
        try {
          var p = localStorage.getItem('kh.theme-mode');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.mode = dark ? 'dark' : 'light';
          r.style.colorScheme = dark ? 'dark' : 'light';
          r.style.backgroundColor = dark ? '#0f1115' : '#f5f6f8';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
