user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WebSocket upgrade, conditional on the client actually asking for one.
    #
    # The site configs previously sent a hard-coded `Connection: upgrade` on
    # every /api request, because that is the snippet everyone copies. The /api
    # location serves ordinary REST calls as well as the agent and notification
    # WebSockets, so each plain GET reached the backend announcing an upgrade it
    # was not performing: `Connection: upgrade` with an empty `Upgrade` header.
    #
    # Two consequences. Keep-alive is broken for every normal API request, since
    # the upstream is told the connection is being taken over. And any plain GET
    # of a WebSocket route is reported by gorilla/websocket as "the client is not
    # using the websocket protocol: 'websocket' token not found in 'Upgrade'
    # header" -- an error that describes the proxy, not the client.
    #
    # With this map, `Connection` is only "upgrade" when the client sent an
    # Upgrade header, and "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/krakenhashes/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/krakenhashes/nginx/error.log warn;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Virtual Host Configs
    include /etc/nginx/conf.d/*.conf;
} 