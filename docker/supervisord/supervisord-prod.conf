[supervisord]
nodaemon=true
user=root
logfile=/var/log/krakenhashes/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# supervisorctl talks to supervisord over this socket. Without these three
# sections supervisorctl has nothing to connect to and every call fails with
# "refused connection" -- which silently broke the nginx reload used by the
# certificate reissue path, the admin diagnostics endpoint, and logrotate's
# postrotate hooks (the last masked by `|| true`).
#
# chown to the krakenhashes group so the backend, which runs as that user, can
# signal nginx to pick up a reissued certificate without being root.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:krakenhashes

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=20
priority=999
stdout_logfile=/var/log/krakenhashes/nginx/stdout.log
stderr_logfile=/var/log/krakenhashes/nginx/stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
user=root

[program:backend]
command=/usr/local/bin/krakenhashes
directory=/etc/krakenhashes
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=1
stdout_logfile=/var/log/krakenhashes/backend/stdout.log
stderr_logfile=/var/log/krakenhashes/backend/stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
user=krakenhashes
environment=HOME="/home/krakenhashes",USER="krakenhashes"

[program:logrotate]
command=/bin/sh -c 'while true; do /usr/sbin/logrotate /etc/logrotate.d/krakenhashes >> /var/log/krakenhashes/logrotate.log 2>> /var/log/krakenhashes/logrotate.err; sleep 3600; done'
autostart=true
autorestart=true
stdout_logfile=/var/log/krakenhashes/logrotate.log
stderr_logfile=/var/log/krakenhashes/logrotate.err
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile_backups=1