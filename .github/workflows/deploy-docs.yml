name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git-revision-date-localized plugin

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-docs.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt

      - name: Deploy dev documentation with mike
        run: |
          # Fetch all branches including gh-pages
          git fetch origin
          
          # Check if gh-pages exists remotely and sync it
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages branch exists, checking out and pulling latest"
            git checkout gh-pages
            git pull origin gh-pages
            git checkout -
          else
            echo "No gh-pages branch exists yet"
          fi
          
          # Deploy as 'dev' version
          mike deploy --push --update-aliases dev
          
          # Check if 'latest' exists, if not set dev as default temporarily
          if ! mike list | grep -q "latest"; then
            echo "No 'latest' version found, setting dev as default"
            mike set-default --push dev
          fi
          
          # Ensure no symlinks remain in gh-pages
          echo "Checking for symlinks in gh-pages"
          
          # Clean up the site directory that Mike created to avoid conflicts
          rm -rf site
          
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          
          # Check and fix latest if it's a symlink
          if [ -L "latest" ]; then
            echo "Found latest as symlink, need to fix"
            # Find what latest points to
            TARGET=$(readlink latest)
            if [ -d "$TARGET" ]; then
              rm -f latest
              cp -r "$TARGET" latest
              git add -A
              git commit -m "Replace latest symlink with directory copy"
              git push --force-with-lease origin gh-pages
            fi
          fi
          
          git checkout -

  preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the git-revision-date-localized plugin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-docs.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt

      - name: Build preview
        # Plain static build for the PR preview artifact -- no mike/serve/wget, so no git
        # commit, no host-prefixed ':' paths, and no crawl to hard-fail on a stray link.
        run: mkdocs build --site-dir ./site

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: ./site
          retention-days: 7

      - name: Comment PR
        uses: actions/github-script@v7
        continue-on-error: true  # commenting needs pull-requests: write; don't fail the check if denied
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 Documentation preview built. Download the **docs-preview** artifact from the Actions tab and open index.html to review changes.'
            })