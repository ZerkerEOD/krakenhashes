name: Tests

# The repo previously ran ZERO tests on a pull request. Every existing workflow
# builds images or publishes docs; none of them execute `go test`, so a change
# that broke the scheduler, the budget ledger or the cloud provisioning gates
# would go green all the way to master.
#
# This runs the suites that actually exist, and does not pretend to run more.

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    # A force-push should cancel the run it superseded rather than queue behind
    # it — the DB job is the long pole and there is no point paying for both.
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend:
        name: Backend (Go)
        runs-on: ubuntu-latest
        timeout-minutes: 30

        services:
            postgres:
                # Match the version the dev stack runs. A test suite that passes
                # on a different major than production is testing the wrong
                # planner, and this codebase leans on Postgres-specific
                # behaviour: partial unique indexes as ON CONFLICT targets,
                # NUMERIC keyspace arithmetic, SELECT ... FOR UPDATE on the
                # budget path.
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: krakenhashes
                    POSTGRES_PASSWORD: krakenhashes
                    # The suite creates krakenhashes_test itself (and refuses to
                    # truncate anything not named like a test database), so this
                    # only needs to be a database it can connect to first.
                    POSTGRES_DB: krakenhashes
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U krakenhashes"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v4
              with:
                  # The gofmt step diffs against the PR base. actions/checkout
                  # is shallow by default (fetch-depth: 1), which leaves neither
                  # the base SHA nor HEAD^ in the local history — `git diff`
                  # would fail outright, or worse, silently produce an empty
                  # file list and report success without checking anything.
                  fetch-depth: 0

            - uses: actions/setup-go@v5
              with:
                  # go.mod declares 1.25.0; the other workflows pin '1.24' and
                  # would fail to build this module.
                  go-version: '1.25'
                  cache-dependency-path: backend/go.sum

            - name: Download modules
              working-directory: backend
              run: go mod download

            - name: Vet
              working-directory: backend
              # Scoped to the packages that are vet-clean today. A repo-wide
              # `go vet ./...` fails on pre-existing issues in unrelated
              # packages (printf directives, a stale auth test helper), and a
              # check that is red on arrival gets ignored rather than fixed.
              # Widen this list as packages are cleaned up.
              run: |
                  go vet \
                    ./internal/services/cloud/... \
                    ./internal/services/scheduler/... \
                    ./internal/repository/... \
                    ./internal/models/... \
                    ./internal/handlers/admin/... \
                    ./cmd/...

            - name: Check formatting
              working-directory: backend
              # Only files touched by this PR. The tree has pre-existing
              # unformatted files; failing on those would make the check
              # permanently red and teach everyone to skip it.
              run: |
                  base="${{ github.event.pull_request.base.sha }}"
                  if [ -z "$base" ]; then
                    echo "Not a pull request — checking the last commit only."
                    base="HEAD^"
                  fi
                  # An unreachable base means the diff below would list nothing
                  # and this step would pass without checking a single file.
                  # Fail loudly instead of reporting a green that means nothing.
                  if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
                    echo "Base commit $base is not in the local history; cannot diff."
                    exit 1
                  fi
                  # Restricted to backend Go files and then made relative,
                  # because this step runs from backend/ — an agent/*.go path
                  # would be looked up under backend/agent/ and silently skipped
                  # by gofmt, reporting success for a file nobody checked.
                  #
                  # ':/backend' is ROOT-RELATIVE pathspec magic, and both halves
                  # of that matter. A 'backend/**.go' glob matches nothing (git
                  # pathspecs are prefix matches, not globs), and a plain
                  # 'backend' pathspec resolves against the CURRENT directory —
                  # which is backend/ here, so it would look for backend/backend.
                  # Either mistake yields an empty file list and a green check
                  # that inspected nothing.
                  changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- ':/backend' \
                            | grep '\.go$' | sed 's|^backend/||' || true)
                  if [ -z "$changed" ]; then
                    echo "No backend Go files changed."
                    exit 0
                  fi
                  # Deleted files are already excluded by --diff-filter, but a
                  # rename can still list a path that no longer exists.
                  existing=""
                  for f in $changed; do
                    [ -f "$f" ] && existing="$existing $f"
                  done
                  if [ -z "$existing" ]; then
                    echo "No backend Go files to check."
                    exit 0
                  fi
                  # shellcheck disable=SC2086
                  unformatted=$(gofmt -l $existing 2>/dev/null || true)
                  if [ -n "$unformatted" ]; then
                    echo "These files need gofmt:"
                    echo "$unformatted"
                    exit 1
                  fi

            - name: Test
              working-directory: backend
              env:
                  TEST_DATABASE_URL: postgres://krakenhashes:krakenhashes@localhost:5432/krakenhashes_test?sslmode=disable
              # -p 1 IS LOAD-BEARING, not a performance tuning choice. Several
              # packages share one test database and truncate it in their
              # fixtures; running two of them concurrently produces deadlocks
              # and foreign-key violations that look like real failures and are
              # not reproducible locally.
              #
              # ./internal/services/scheduler is excluded: it has 3 known
              # failures from a genuine spec disagreement about max_agents_fifo
              # overflow (migration 000154's setting description says
              # priority-agnostic; the docs and allocator.go say priority-first).
              # It is listed in the follow-up step below so the gap stays
              # visible rather than silently dropped.
              run: |
                  go test -p 1 -timeout 25m \
                    ./internal/services/cloud/... \
                    ./internal/repository/... \
                    ./internal/models/... \
                    ./internal/handlers/admin/... \
                    ./internal/testutil/...

            - name: Known-failing suites (reported, not gating)
              working-directory: backend
              env:
                  TEST_DATABASE_URL: postgres://krakenhashes:krakenhashes@localhost:5432/krakenhashes_test?sslmode=disable
              # Runs so a NEW scheduler regression is visible in the log, while
              # the 3 pre-existing allocator failures do not block every PR.
              # Delete this step once that spec question is settled.
              continue-on-error: true
              run: go test -p 1 -timeout 15m ./internal/services/scheduler/...

    agent:
        name: Agent (Go)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: agent/go.sum

            - name: Test
              working-directory: agent
              # No database, so the default parallelism is fine here.
              #
              # Scoped to the packages that pass today. Four have pre-existing
              # failures (config, jobs, metrics/integration_test, sync) and are
              # run in the reporting step below instead — a gate that is red the
              # day it lands gets ignored rather than fixed, and then it is
              # protecting nothing.
              #
              # Two files in internal/agent are also quarantined as .disabled:
              # connection_pump_test.go (broken since 219b3954 — restoring it
              # needs an interface seam on Connection.ws, a production refactor)
              # and registration_advanced_test.go. They blocked all 43 other
              # tests in that package, so quarantining them was the difference
              # between running most of internal/agent and none of it.
              run: |
                  go test -timeout 10m \
                    ./internal/agent/... \
                    ./internal/auth/... \
                    ./internal/buffer/... \
                    ./internal/cleanup/... \
                    ./internal/hardware/... \
                    ./internal/heartbeat/... \
                    ./internal/metrics \
                    ./internal/status/... \
                    ./pkg/...

            - name: Known-failing agent suites (reported, not gating)
              working-directory: agent
              # Visible so a NEW failure in these packages is greppable in the
              # log, and so the debt has a name instead of being invisible.
              # Move each package up to the gating step as it is fixed.
              continue-on-error: true
              run: |
                  go test -timeout 10m \
                    ./internal/config/... \
                    ./internal/jobs/... \
                    ./internal/metrics/integration_test/... \
                    ./internal/sync/...

    agent-watchdog:
        name: Agent watchdog (shell)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Watchdog teardown tests
              working-directory: agent
              # Guards the in-guest self-destruct path, including the ordering
              # rule that `pkill -9 hashcat` runs BEFORE any provider branch.
              # A failed teardown that leaves hashcat running bills at full GPU
              # rate for the whole fall-through.
              run: bash watchdog_test.sh

    frontend:
        name: Frontend (TypeScript)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install
              working-directory: frontend
              run: npm ci

            - name: Typecheck
              working-directory: frontend
              # There is no `npm test` script in this project, so typecheck plus
              # a real build is the whole frontend gate. Saying so plainly beats
              # a step named "test" that runs nothing.
              run: npx tsc --noEmit -p tsconfig.json

            - name: Build
              working-directory: frontend
              run: npm run build

    migrations:
        name: Migrations (up and down)
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: krakenhashes
                    POSTGRES_PASSWORD: krakenhashes
                    POSTGRES_DB: krakenhashes_migrations
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U krakenhashes"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: backend/go.sum

            - name: Install golang-migrate
              run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

            - name: Migrate up
              env:
                  DSN: postgres://krakenhashes:krakenhashes@localhost:5433/krakenhashes_migrations?sslmode=disable
              run: migrate -path backend/db/migrations -database "$DSN" up

            - name: Roll the newest migration down and back up
              env:
                  DSN: postgres://krakenhashes:krakenhashes@localhost:5433/krakenhashes_migrations?sslmode=disable
              # Down scripts are written but almost never executed, so they rot
              # silently — and the one time they matter is a production rollback
              # at speed. This exercises only the newest step: a full `down`
              # over the whole history is slow and mostly re-tests migrations
              # that have not changed.
              #
              # Deliberately does NOT assert a clean rollback of every table:
              # some down scripts refuse on purpose (the RunPod one fails while
              # cloud_instances still reference a RunPod config, because
              # discarding those rows would orphan a possibly-running GPU).
              run: |
                  migrate -path backend/db/migrations -database "$DSN" down 1
                  migrate -path backend/db/migrations -database "$DSN" up
