name: Build Cloud GPU Branch Image

# Branch-tagged image for testing cloud GPU provisioning on real hardware
# BEFORE it reaches master.
#
# build-dev.yml triggers on master only and publishes `:dev`, so merging to
# master to get a testable image would republish `:dev` to every operator who
# pulls it — proving the feature on production hardware AFTER shipping it to
# everyone. This inverts that: prove it here, merge afterwards.
#
# Copied from build-dev.yml rather than build-scheduler-v2.yml/build-teams.yml:
# those predate the launcher and omit its build steps, while Dockerfile.prod
# still COPYs bin/launcher. They would fail to build today.
#
# Delete this workflow once the branch merges.

on:
  push:
    branches:
      - feature/cloud-gpu-provisioning
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '**.md'
      - '.github/workflows/deploy-docs*.yml'
      - '.github/workflows/fix-gh-pages.yml'
      - '.github/workflows/validate-translations.yml'
  # Manual trigger: the paths-ignore above can skip a push that only touched
  # docs, and a rebuild should never require an empty commit.
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build agent binaries for all platforms FIRST
  agent-binaries:
    name: Build Agent - ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: 386
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          # Linux
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: 386
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: linux
            arch: arm
            goarm: 7
            ext: ""
          # macOS
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get agent version
        id: agent_version
        run: echo "VERSION=$(jq -r .agent versions.json)" >> $GITHUB_OUTPUT

      - name: Get short commit SHA
        id: commit_agent
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build agent binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        working-directory: ./agent
        run: |
          VERSION=${{ steps.agent_version.outputs.VERSION }}
          COMMIT=${{ steps.commit_agent.outputs.short }}
          BINARY_NAME=krakenhashes-agent${{ matrix.ext }}
          go build -v -ldflags="-s -w -X github.com/ZerkerEOD/krakenhashes/agent/internal/version.Version=${VERSION}-${COMMIT}-cloud-gpu" \
            -o ${BINARY_NAME} ./cmd/agent

      - name: Build launcher binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        working-directory: ./agent
        run: |
          LAUNCHER_VERSION=$(jq -r '.launcher // .agent' ../versions.json)
          COMMIT=${{ steps.commit_agent.outputs.short }}
          BINARY_NAME=krakenhashes-launcher${{ matrix.ext }}
          go build -v -ldflags="-s -w -X main.Version=${LAUNCHER_VERSION}-${COMMIT}-cloud-gpu" \
            -o ${BINARY_NAME} ./cmd/launcher

      - name: Upload binary for Docker build
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: ./agent/krakenhashes-agent${{ matrix.ext }}
          retention-days: 1

      - name: Upload launcher for Docker build
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}-${{ matrix.arch }}
          path: ./agent/krakenhashes-launcher${{ matrix.ext }}
          retention-days: 1

  # Build and push Docker images (after agent binaries are built)
  docker:
    name: Build Cloud GPU Docker Image
    needs: [agent-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: ./agent-binaries

      - name: Download all launcher binaries
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: ./launcher-binaries

      - name: Organize binaries for Docker build
        run: |
          # Create the directory structure expected by the Dockerfile
          mkdir -p ./bin/agent

          # Move binaries to organized structure
          for binary_dir in ./agent-binaries/binary-*; do
            if [ -d "$binary_dir" ]; then
              # Extract os and arch from directory name (e.g., binary-linux-amd64)
              dir_name=$(basename "$binary_dir")
              os_arch="${dir_name#binary-}"
              os="${os_arch%-*}"
              arch="${os_arch##*-}"

              # Create destination directory
              mkdir -p "./bin/agent/$os/$arch"

              # Move binary to destination
              if [ -f "$binary_dir/krakenhashes-agent.exe" ]; then
                mv "$binary_dir/krakenhashes-agent.exe" "./bin/agent/$os/$arch/"
              elif [ -f "$binary_dir/krakenhashes-agent" ]; then
                mv "$binary_dir/krakenhashes-agent" "./bin/agent/$os/$arch/"
              fi
            fi
          done

          # Move launcher binaries into bin/launcher/{os}/{arch}/ (Dockerfile.prod COPYs this)
          mkdir -p ./bin/launcher
          for launcher_dir in ./launcher-binaries/launcher-*; do
            if [ -d "$launcher_dir" ]; then
              dir_name=$(basename "$launcher_dir")
              os_arch="${dir_name#launcher-}"
              os="${os_arch%-*}"
              arch="${os_arch##*-}"

              mkdir -p "./bin/launcher/$os/$arch"

              if [ -f "$launcher_dir/krakenhashes-launcher.exe" ]; then
                mv "$launcher_dir/krakenhashes-launcher.exe" "./bin/launcher/$os/$arch/"
              elif [ -f "$launcher_dir/krakenhashes-launcher" ]; then
                mv "$launcher_dir/krakenhashes-launcher" "./bin/launcher/$os/$arch/"
              fi
            fi
          done

          # List the structure for debugging
          echo "Agent binary structure:"
          ls -lR ./bin/agent
          echo "Launcher binary structure:"
          ls -lR ./bin/launcher

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate lowercase image name
        id: image
        run: echo "name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get short commit SHA
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push dev Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:cloud-gpu
          build-args: |
            COMMIT_SHA=${{ steps.commit.outputs.short }}
            BUILD_TYPE=dev
          labels: |
            org.opencontainers.image.description=KrakenHashes - cloud GPU provisioning branch build (NOT for general use)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Scoped so this branch's layers never evict or get served to the
          # :dev build. Without a scope both workflows share one GHA cache key
          # and each invalidates the other on every push.
          cache-from: type=gha,scope=cloud-gpu
          cache-to: type=gha,mode=max,scope=cloud-gpu

      - name: Image information
        run: |
          IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')
          echo "✅ Dev image built and pushed successfully!"
          echo ""
          echo "Docker image: ${{ env.REGISTRY }}/${IMAGE_NAME}:cloud-gpu"
          echo "Pull with: docker pull ${{ env.REGISTRY }}/${IMAGE_NAME}:cloud-gpu"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
